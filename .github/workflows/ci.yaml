name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
      GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26"]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Restore Go caches
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}-
            ${{ runner.os }}-go-${{ matrix.go-version }}-

      - name: Show Go version
        run: go version

      - name: Download dependencies
        run: go mod download

      - name: Verify formatting
        run: |
          unformatted=$(go list -f '{{.Dir}}' ./... | xargs -r gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go fix is clean
        run: |
          go fix ./...
          git diff --exit-code

      - name: Verify go.mod is tidy
        run: |
          cp go.mod go.mod.ci-backup
          cp go.sum go.sum.ci-backup
          go mod tidy
          if ! diff -q go.mod go.mod.ci-backup >/dev/null || ! diff -q go.sum go.sum.ci-backup >/dev/null; then
            echo "go.mod/go.sum are not tidy; run 'go mod tidy' and commit the result:"
            diff -u go.mod.ci-backup go.mod || true
            diff -u go.sum.ci-backup go.sum || true
            rm -f go.mod.ci-backup go.sum.ci-backup
            exit 1
          fi
          rm -f go.mod.ci-backup go.sum.ci-backup

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test ./...

      - name: Run race tests
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
